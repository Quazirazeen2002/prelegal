[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for Prelegal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "litellm>=1.99.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "fpdf2>=2.8.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
